<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Invaders — BLOOKET Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Share Tech Mono', monospace;
            color: #00ff88;
            overflow: hidden;
            user-select: none;
        }

        #game-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        #hud {
            width: 700px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 12px;
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 6px;
        }

        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .hud-label {
            font-size: 10px;
            color: rgba(0, 255, 136, 0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hud-value {
            font-family: 'Orbitron', monospace;
            font-size: 20px;
            font-weight: 700;
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
        }

        #score-val {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        #hi-score-val {
            color: #ff6b9d;
            text-shadow: 0 0 10px #ff6b9d;
        }

        #wave-val {
            color: #ffd60a;
            text-shadow: 0 0 10px #ffd60a;
        }

        #canvas {
            display: block;
            border: 1px solid rgba(0, 255, 136, 0.25);
            border-radius: 4px;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.15), inset 0 0 80px rgba(0, 0, 0, 0.8);
        }

        #lives-row {
            width: 700px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 14px;
        }

        .lives-label {
            font-size: 11px;
            color: rgba(0, 255, 136, 0.5);
            letter-spacing: 2px;
        }

        #lives-icons {
            display: flex;
            gap: 8px;
        }

        .life-icon {
            width: 22px;
            height: 22px;
            clip-path: polygon(50% 0%, 0% 100%, 15% 75%, 35% 88%, 50% 70%, 65% 88%, 85% 75%, 100% 100%);
            background: #00ff88;
            box-shadow: 0 0 8px #00ff88;
            transition: all 0.2s;
        }

        #powerup-bar {
            width: 700px;
            height: 28px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 10px;
        }

        .powerup-label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
        }

        #powerup-active {
            font-family: 'Orbitron', monospace;
            font-size: 13px;
            padding: 2px 12px;
            border-radius: 20px;
            display: none;
        }

        #touch-controls {
            display: none;
            gap: 20px;
            margin-top: 8px;
        }

        .touch-btn {
            width: 70px;
            height: 50px;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-radius: 10px;
            color: #00ff88;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        @media (pointer: coarse) {
            #touch-controls {
                display: flex;
            }
        }
    </style>
</head>

<body>
    <div id="game-wrapper">
        <div id="hud">
            <div class="hud-item">
                <span class="hud-label">Score</span>
                <span class="hud-value" id="score-val">000000</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Hi-Score</span>
                <span class="hud-value" id="hi-score-val">000000</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Wave</span>
                <span class="hud-value" id="wave-val">01</span>
            </div>
        </div>

        <canvas id="canvas" width="700" height="540"></canvas>

        <div id="lives-row">
            <span class="lives-label">LIVES</span>
            <div id="lives-icons"></div>
            <div style="flex:1"></div>
            <div id="powerup-bar">
                <span class="powerup-label">POWER-UP</span>
                <span id="powerup-active"></span>
            </div>
        </div>

        <div id="touch-controls">
            <div class="touch-btn" id="btn-left">◀</div>
            <div class="touch-btn" id="btn-fire">🔥</div>
            <div class="touch-btn" id="btn-right">▶</div>
        </div>
    </div>

    <script src="game.js"></script>
</body>

</html>
