<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Discover</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      :root{--side:#9d42bf;--side-deep:#8030a3;--teal:#18c3d6;--copy:#2a3959;--copy-soft:#61718f}
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;font-family:"Nunito","Segoe UI",sans-serif;background:linear-gradient(135deg,#21cfe3 0%,#18c3d6 52%,#12b3ca 100%)}
      .shell{display:grid;grid-template-columns:136px minmax(0,1fr);min-height:100vh}
      .sidebar{position:sticky;top:0;display:flex;flex-direction:column;gap:16px;height:100vh;padding:14px 12px 16px;background:linear-gradient(180deg,var(--side) 0%,var(--side-deep) 100%);box-shadow:16px 0 34px rgba(72,18,95,.22)}
      .brand{display:inline-block;color:#fff;text-decoration:none;font-family:"Baloo 2","Nunito",sans-serif;font-size:2.6rem;line-height:.92}
      .play-cta{display:flex;align-items:center;justify-content:center;min-height:38px;border-radius:8px;background:linear-gradient(180deg,#1ad0df 0%,#10b7d2 100%);box-shadow:0 5px 0 rgba(4,131,161,.72);color:#fff;text-decoration:none;font-weight:900;font-size:1.1rem}
      .nav{display:grid;gap:6px}
      .nav-link{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 12px;border-radius:8px;color:rgba(255,255,255,.96);text-decoration:none;font-weight:800;transition:transform .18s ease,background .18s ease,color .18s ease}
      .nav-link:hover,.nav-link.is-active{background:rgba(255,255,255,.94);color:#9a42bc;transform:translateX(2px)}
      .nav-icon{width:12px;height:12px;flex:0 0 12px;border-radius:3px;background:currentColor}
      .side-footer{margin-top:auto;display:grid;gap:10px}
      .side-pill,.side-link{display:flex;align-items:center;justify-content:center;min-height:34px;padding:0 12px;border-radius:999px;text-decoration:none;font-weight:800}
      .side-pill{background:rgba(255,255,255,.14);color:#fff}
      .side-link{background:rgba(0,0,0,.14);color:#fff}
      .main{min-width:0;min-height:100vh;padding:12px 18px 28px;background:rgba(255,255,255,.97);color:var(--copy)}
      .page{width:min(1450px,100%);margin:0 auto}
      .topbar{display:flex;justify-content:flex-end;align-items:center;gap:12px}
      .coins{display:inline-flex;align-items:center;justify-content:center;min-width:84px;min-height:40px;padding:0 14px;border-radius:12px;background:#fff;color:#cc9500;font-family:"Baloo 2","Nunito",sans-serif;font-size:1.1rem;font-weight:800;box-shadow:0 5px 0 rgba(184,197,214,.6)}
      .account{display:inline-flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;min-width:180px;border-radius:10px;background:linear-gradient(180deg,#9e4cc2 0%,#8532aa 100%);box-shadow:0 5px 0 rgba(94,31,121,.62);color:#fff}
      .avatar{width:34px;height:34px;overflow:hidden;flex:0 0 34px;border-radius:9px;background:linear-gradient(180deg,#7feea4 0%,#51bc72 100%);border:2px solid rgba(255,255,255,.28)}
      .avatar img{width:100%;height:100%;display:block;object-fit:cover}
      .avatar-fallback{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:#fff;font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;text-transform:uppercase}
      .account strong,.account span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .account strong{font-size:1.05rem;line-height:1.1}
      .account span{color:rgba(232,243,255,.84);font-size:.76rem;font-weight:800}
      h1{margin:10px 0 12px;font-family:"Baloo 2","Nunito",sans-serif;font-size:clamp(2.4rem,4vw,3.4rem);line-height:.95}
      .search{position:relative;display:block;width:min(940px,100%);margin-bottom:14px}
      .search input{width:100%;min-height:54px;padding:0 64px 0 18px;border:3px solid var(--teal);border-radius:10px;outline:none;font:inherit;font-size:1.35rem;color:var(--copy);background:#fff;box-shadow:0 4px 0 rgba(11,167,194,.18)}
      .search input:focus{box-shadow:0 0 0 5px rgba(24,195,214,.16)}
      .search-icon{position:absolute;right:10px;top:50%;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;background:linear-gradient(180deg,#17cbde 0%,#0db3cb 100%);box-shadow:0 4px 0 rgba(11,152,177,.6);color:#fff;font-size:1.45rem;transform:translateY(-50%);pointer-events:none}
      .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid rgba(129,149,185,.28)}
      .meta{display:flex;flex-wrap:wrap;gap:10px}
      .meta-pill{display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border-radius:999px;background:#eef4ff;color:#5a6b89;font-size:.92rem;font-weight:800}
      .toolbar a{color:#1384da;font-weight:900;text-decoration:none}
      .section{margin-bottom:28px}
      .featured{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(228px,228px);gap:18px;overflow-x:auto;padding-bottom:4px}
      .panel{display:grid;grid-template-columns:1.2fr 2.2fr;gap:16px;align-items:center;margin:10px auto 8px;padding:18px 24px;max-width:800px;border:1px solid rgba(151,165,196,.45);border-radius:12px;background:#fff;box-shadow:0 10px 28px rgba(112,135,170,.12)}
      .panel strong{display:block;margin-bottom:6px;font-size:1.7rem;line-height:1;font-family:"Baloo 2","Nunito",sans-serif}
      .panel span{color:var(--copy-soft);font-size:.95rem;font-weight:800}
      .subjects{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
      .subject{border:0;background:transparent;cursor:pointer;color:var(--copy);font:inherit}
      .subject-inner{display:grid;justify-items:center;gap:8px;min-width:80px}
      .subject-dot{display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:999px;color:#fff;font-size:1.2rem;font-weight:900;box-shadow:0 8px 16px rgba(56,72,112,.18)}
      .subject-label{font-size:.88rem;font-weight:900}
      .subject.is-active .subject-dot{transform:translateY(-2px) scale(1.06);box-shadow:0 10px 22px rgba(56,72,112,.24)}
      h2{margin:0 0 14px;text-align:center;font-family:"Baloo 2","Nunito",sans-serif;font-size:clamp(2rem,3vw,2.6rem);line-height:.95}
      .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
      .card-shell{position:relative}
      .card-wrap{display:block;color:inherit;text-decoration:none}
      .card{overflow:hidden;border-radius:12px;background:#fff;box-shadow:0 12px 24px rgba(87,112,155,.16);transition:transform .18s ease,box-shadow .18s ease}
      .card-shell:hover .card{transform:translateY(-3px);box-shadow:0 16px 28px rgba(72,95,140,.22)}
      .favorite-btn{position:absolute;top:10px;right:10px;z-index:2;display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:34px;padding:0 10px;border:0;border-radius:999px;background:rgba(255,255,255,.92);color:#8d4ab1;font:inherit;font-size:1rem;font-weight:900;cursor:pointer;box-shadow:0 4px 10px rgba(84,98,136,.18)}
      .favorite-btn.is-active{background:#ffe182;color:#7b5400}
      .favorite-btn span{display:none}
      .card-hero{position:relative;height:124px;padding:10px 12px;overflow:hidden;background:var(--hero-bg,linear-gradient(135deg,#5a6cf8 0%,#2ca8ff 100%))}
      .card-hero:before,.card-hero:after{content:"";position:absolute;opacity:.18;pointer-events:none}
      .card-hero:before{width:160px;height:160px;top:-40px;right:-16px;border-radius:50%;background:rgba(255,255,255,.8)}
      .card-hero:after{left:-18px;bottom:-28px;width:120px;height:120px;border-radius:22px;background:rgba(255,255,255,.4);transform:rotate(14deg)}
      .card-badge{position:absolute;top:8px;left:8px;z-index:1;display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:7px;background:#17c8dc;color:#fff;font-size:.72rem;font-weight:900}
      .card-badge.community{background:#ff9b2f}
      .card-word{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;color:rgba(255,255,255,.96);text-align:center;font-family:"Baloo 2","Nunito",sans-serif;font-size:clamp(1.8rem,4vw,2.5rem);font-weight:900;line-height:.88;letter-spacing:.03em;text-shadow:0 4px 10px rgba(27,27,27,.2)}
      .card-pill{position:absolute;right:10px;bottom:10px;z-index:1;display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;background:rgba(0,0,0,.74);color:#fff;font-size:.82rem;font-weight:900}
      .card-body{padding:10px 2px 0}
      .card-title{margin:0 0 2px;font-size:1.05rem;line-height:1.08;font-weight:900;color:var(--copy)}
      .card-meta{display:flex;flex-wrap:wrap;gap:6px 10px;color:var(--copy-soft);font-size:.82rem;font-weight:800}
      .empty{padding:28px 24px;border-radius:14px;background:#f5f8ff;text-align:center;color:var(--copy-soft);font-weight:800}
      .empty strong{display:block;margin-bottom:6px;color:var(--copy);font-size:1.08rem}
      @media (max-width:1100px){.panel{grid-template-columns:1fr;text-align:center}.toolbar{flex-direction:column;align-items:flex-start}}
      @media (max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto}}
      @media (max-width:640px){.main{padding:12px 12px 24px}.topbar{flex-wrap:wrap;justify-content:flex-start}.search input{font-size:1.05rem}.featured{grid-auto-columns:minmax(210px,210px)}}
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="/student-login">Blooket</a>
        <a class="play-cta" href="/play">▶ Play</a>
        <nav class="nav" aria-label="Student navigation">
          <a class="nav-link" href="/student-login#studentStatsBoard"><span class="nav-icon" aria-hidden="true"></span><span>Stats</span></a>
          <a class="nav-link" href="/student-login#studentBlooksBoard"><span class="nav-icon" aria-hidden="true"></span><span>Blooks</span></a>
          <a class="nav-link" href="/student-market"><span class="nav-icon" aria-hidden="true"></span><span>Market</span></a>
          <a class="nav-link is-active" href="/student-discover"><span class="nav-icon" aria-hidden="true"></span><span>Discover</span></a>
          <a class="nav-link" href="/student-set-creator"><span class="nav-icon" aria-hidden="true"></span><span>Set Creator</span></a>
          <a class="nav-link" href="/student-my-sets"><span class="nav-icon" aria-hidden="true"></span><span>My Sets</span></a>
          <a class="nav-link" href="/student-favorites"><span class="nav-icon" aria-hidden="true"></span><span>Favorites</span></a>
        </nav>
        <div class="side-footer">
          <div id="studentDiscoverRoomCode" class="side-pill">Room: none</div>
          <a class="side-link" href="/student-settings">Settings</a>
          <a class="side-link" href="/student-login">Back to Dashboard</a>
        </div>
      </aside>
      <main class="main">
        <div class="page">
          <div class="topbar">
            <div id="studentDiscoverCoins" class="coins">0</div>
            <div class="account">
              <div id="studentDiscoverAvatar" class="avatar"></div>
              <div>
                <strong id="studentDiscoverName">Student</strong>
                <span id="studentDiscoverStatus">Ready to discover</span>
              </div>
            </div>
          </div>
          <h1>Discover</h1>
          <label class="search" for="studentDiscoverSearch">
            <input id="studentDiscoverSearch" type="search" placeholder="Search for a set..." autocomplete="off" />
            <span class="search-icon" aria-hidden="true">⌕</span>
          </label>
          <div class="toolbar">
            <div id="studentDiscoverMeta" class="meta"></div>
            <a id="studentDiscoverPlayLink" href="/play">Play a Live Game</a>
          </div>
          <section class="section" aria-label="Featured sets">
            <div id="studentDiscoverFeatured" class="featured"></div>
          </section>
          <section class="section">
            <div class="panel">
              <div>
                <strong>Blooket Curriculum</strong>
                <span>Select a subject to get started →</span>
              </div>
              <div id="studentDiscoverSubjects" class="subjects"></div>
            </div>
          </section>
          <section class="section">
            <h2>Popular Picks</h2>
            <div id="studentDiscoverPopular" class="grid"></div>
          </section>
        </div>
      </main>
    </div>
    <script src="/student-discover.js"></script>
  </body>
</html>
