<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Favorites</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      :root{--side:#9d42bf;--side-deep:#8030a3;--teal:#18c3d6;--teal-deep:#0fb3ca;--copy:#2b3958;--copy-soft:#657590;--line:#d9e1ef}
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;font-family:"Nunito","Segoe UI",sans-serif;background:linear-gradient(135deg,#21cfe3 0%,#18c3d6 52%,#12b3ca 100%)}
      .shell{display:grid;grid-template-columns:136px minmax(0,1fr);min-height:100vh}
      .sidebar{position:sticky;top:0;display:flex;flex-direction:column;gap:16px;height:100vh;padding:14px 12px 16px;background:linear-gradient(180deg,var(--side) 0%,var(--side-deep) 100%);box-shadow:16px 0 34px rgba(72,18,95,.22)}
      .brand{display:inline-block;color:#fff;text-decoration:none;font-family:"Baloo 2","Nunito",sans-serif;font-size:2.6rem;line-height:.92}
      .play-cta{display:flex;align-items:center;justify-content:center;min-height:38px;border-radius:8px;background:linear-gradient(180deg,#1ad0df 0%,#10b7d2 100%);box-shadow:0 5px 0 rgba(4,131,161,.72);color:#fff;text-decoration:none;font-weight:900;font-size:1.1rem}
      .nav{display:grid;gap:6px}
      .nav-link{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 12px;border-radius:8px;color:rgba(255,255,255,.96);text-decoration:none;font-weight:800;transition:transform .18s ease,background .18s ease,color .18s ease}
      .nav-link:hover,.nav-link.is-active{background:rgba(255,255,255,.94);color:#9a42bc;transform:translateX(2px)}
      .nav-icon{width:12px;height:12px;flex:0 0 12px;border-radius:3px;background:currentColor}
      .side-footer{margin-top:auto;display:grid;gap:10px}
      .side-pill,.side-link{display:flex;align-items:center;justify-content:center;min-height:34px;padding:0 12px;border-radius:999px;text-decoration:none;font-weight:800}
      .side-pill{background:rgba(255,255,255,.14);color:#fff}
      .side-link{background:rgba(0,0,0,.14);color:#fff}
      .main{min-width:0;min-height:100vh;padding:12px 18px 28px;background:rgba(255,255,255,.97);color:var(--copy)}
      .page{width:min(1460px,100%);margin:0 auto}
      .topbar{display:flex;justify-content:flex-end;align-items:center;gap:12px}
      .coins{display:inline-flex;align-items:center;justify-content:center;min-width:84px;min-height:40px;padding:0 14px;border-radius:12px;background:#fff;color:#cc9500;font-family:"Baloo 2","Nunito",sans-serif;font-size:1.1rem;font-weight:800;box-shadow:0 5px 0 rgba(184,197,214,.6)}
      .account{display:inline-flex;align-items:center;gap:10px;padding:6px 10px 6px 6px;min-width:180px;border-radius:10px;background:linear-gradient(180deg,#9e4cc2 0%,#8532aa 100%);box-shadow:0 5px 0 rgba(94,31,121,.62);color:#fff}
      .avatar{width:34px;height:34px;overflow:hidden;flex:0 0 34px;border-radius:9px;background:linear-gradient(180deg,#7feea4 0%,#51bc72 100%);border:2px solid rgba(255,255,255,.28)}
      .avatar img{width:100%;height:100%;display:block;object-fit:cover}
      .avatar-fallback{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:#fff;font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;text-transform:uppercase}
      .account strong,.account span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .account strong{font-size:1.05rem;line-height:1.1}
      .account span{color:rgba(232,243,255,.84);font-size:.76rem;font-weight:800}
      h1{margin:10px 0 0;font-family:"Baloo 2","Nunito",sans-serif;font-size:clamp(2.4rem,4vw,3.4rem);line-height:.95}
      .subtitle{margin:6px 0 20px;color:var(--copy-soft);font-weight:700}
      .meta{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
      .meta-pill{display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border-radius:999px;background:#eef4ff;color:#5a6b89;font-size:.92rem;font-weight:800}
      .empty-shell{display:grid;place-items:center;min-height:calc(100vh - 220px)}
      .empty-card{width:min(310px,100%);padding:18px 18px 16px;border:1px solid #686f77;border-radius:8px;background:#efefef;text-align:center}
      .empty-card h2{margin:0 0 16px;font-size:1.95rem;line-height:1.08}
      .action{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;color:#fff;text-decoration:none;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.18)}
      .action.teal{background:linear-gradient(180deg,var(--teal) 0%,var(--teal-deep) 100%);box-shadow:0 5px 0 rgba(8,148,170,.55)}
      .tutorial{display:inline-block;margin-top:12px;color:var(--copy);font-size:1rem;font-weight:800;text-decoration:underline}
      .toolbar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px}
      .ghost{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 14px;border-radius:10px;border:1px solid #d6deeb;background:#fff;color:var(--copy);text-decoration:none;font-weight:900;box-shadow:0 3px 0 rgba(175,184,198,.7)}
      .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
      .card-shell{position:relative}
      .favorite-btn{position:absolute;top:10px;right:10px;z-index:2;display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:34px;padding:0 10px;border:0;border-radius:999px;background:#ffe182;color:#7b5400;font:inherit;font-size:1rem;font-weight:900;cursor:pointer;box-shadow:0 4px 10px rgba(84,98,136,.18)}
      .card{overflow:hidden;border-radius:14px;background:#fff;border:1px solid var(--line);box-shadow:0 12px 24px rgba(87,112,155,.14)}
      .card-hero{display:grid;place-items:center;height:132px;padding:16px;color:#fff;font-family:"Baloo 2","Nunito",sans-serif;font-size:2rem;font-weight:900;line-height:.9;text-align:center;background:linear-gradient(135deg,#55a6ff 0%,#6f63ff 100%)}
      .card-hero.has-cover{padding:0}
      .card-hero img{width:100%;height:100%;display:block;object-fit:cover}
      .card-body{padding:14px}
      .card-title{margin:0 0 6px;font-size:1.18rem;line-height:1.1}
      .card-copy{margin:0 0 10px;color:var(--copy-soft);font-weight:700}
      .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
      .chip{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:999px;background:#eef4ff;color:#586a88;font-size:.82rem;font-weight:900}
      .card-actions{display:flex;flex-wrap:wrap;gap:10px}
      @media (max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto}}
      @media (max-width:640px){.main{padding:12px 12px 24px}.topbar{flex-wrap:wrap;justify-content:flex-start}}
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="/student-login">Blooket</a>
        <a class="play-cta" href="/play">Play</a>
        <nav class="nav" aria-label="Student navigation">
          <a class="nav-link" href="/student-login#studentStatsBoard"><span class="nav-icon" aria-hidden="true"></span><span>Stats</span></a>
          <a class="nav-link" href="/student-login#studentBlooksBoard"><span class="nav-icon" aria-hidden="true"></span><span>Blooks</span></a>
          <a class="nav-link" href="/student-market"><span class="nav-icon" aria-hidden="true"></span><span>Market</span></a>
          <a class="nav-link" href="/student-discover"><span class="nav-icon" aria-hidden="true"></span><span>Discover</span></a>
          <a class="nav-link" href="/student-set-creator"><span class="nav-icon" aria-hidden="true"></span><span>Set Creator</span></a>
          <a class="nav-link" href="/student-my-sets"><span class="nav-icon" aria-hidden="true"></span><span>My Sets</span></a>
          <a class="nav-link is-active" href="/student-favorites"><span class="nav-icon" aria-hidden="true"></span><span>Favorites</span></a>
        </nav>
        <div class="side-footer">
          <div id="studentFavoritesRoomCode" class="side-pill">Room: none</div>
          <a class="side-link" href="/student-settings">Settings</a>
          <a class="side-link" href="/student-login">Back to Dashboard</a>
        </div>
      </aside>

      <main class="main">
        <div class="page">
          <div class="topbar">
            <div id="studentFavoritesCoins" class="coins">0</div>
            <div class="account">
              <div id="studentFavoritesAvatar" class="avatar"></div>
              <div>
                <strong id="studentFavoritesName">Student</strong>
                <span id="studentFavoritesStatus">Favorite sets</span>
              </div>
            </div>
          </div>

          <h1>Favorites</h1>
          <p class="subtitle">Quick access to the sets you have starred from Discover.</p>
          <div id="studentFavoritesMeta" class="meta"></div>
          <div id="studentFavoritesContent"></div>
        </div>
      </main>
    </div>

    <script src="/student-favorites.js"></script>
  </body>
</html>
